# /etc/dnsmasq.d/pxe.conf - proxyDHCP + TFTP for PXE/iPXE
#
# proxyDHCP mode: we do NOT hand out IP addresses. Your existing router/DHCP server keeps doing
# that; dnsmasq only answers the PXE half of the conversation ("where do I get a boot loader?").
# That means you can drop this on any homelab LAN without touching the router.
#
# Placeholders @SERVER_IP@ @IFACE@ @TFTP@ are substituted by install-server.sh.

# No DNS service from dnsmasq (avoids fighting systemd-resolved on :53). 0 = disabled.
port=0

# Only listen on the PXE segment. Comment out if the host has a single NIC.
interface=@IFACE@
bind-interfaces

# Only answer DHCP for this interface/segment; "proxy" = never allocate a lease.
dhcp-range=@SERVER_IP@,proxy

# Give the PXE firmware 3 seconds to let a human press F8/F12, then continue.
pxe-prompt="PXE: press F8 for the deployment menu", 3

# Stage 1: what the *firmware* downloads over TFTP. Legacy BIOS gets undionly.kpxe,
# 64-bit UEFI gets ipxe.efi. (x86 UEFI would be pxe-service=IA32_EFI.)
pxe-service=X86PC,     "Boot from network (BIOS)", undionly.kpxe
pxe-service=X86-64_EFI,"Boot from network (UEFI)", ipxe.efi

# Stage 2: iPXE re-requests DHCP with user-class "iPXE" (option 175). It is too big to keep
# chainloading over TFTP, so hand it an HTTP URL - menus, WinPE boot files and wimboot all
# travel over TCP/80 instead.
dhcp-match=set:ipxe,175
dhcp-boot=tag:ipxe,http://@SERVER_IP@/boot.ipxe

# TFTP
enable-tftp
tftp-root=@TFTP@

# Log every PXE client so you can see MAC + arch + which stage it reached.
log-dhcp
log-queries

# Some firmwares (and Windows Setup in WDS-mode) want option 252; blank keeps it quiet.
#dhcp-option=252,"\n"

# ---------------------------------------------------------------------------
# Alternative, Secure Boot friendly, no-iPXE route (signed Microsoft boot manager):
# keep Secure Boot ON and point the firmware straight at Microsoft's signed EFI loader.
# You lose the menu; the WinPE image must be a WDS-style layout under the TFTP root.
#   pxe-service=X86-64_EFI, "Windows Setup (signed)", wdsmgfw.efi
# ---------------------------------------------------------------------------
