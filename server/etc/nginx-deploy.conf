# /etc/nginx/sites-available/pxe-deploy
# Serves the iPXE menu, wimboot, and the WinPE boot files. Placeholders @HTTP@ @SERVER_IP@
# are substituted by install-server.sh.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name @SERVER_IP@ _;

    root @HTTP@;

    # WIM/EFI/ISO are binary blobs - never let a proxy or a caching layer "help".
    location / {
        autoindex on;              # handy for eyeballing /winpe and /boot in a browser
        autoindex_exact_size off;
        add_header Cache-Control "no-store" always;
        sendfile on;
        tcp_nopush on;
    }

    # wimboot + boot.sdi + BCD are small; boot.wim is 400-900 MB and install.wim can be
    # pulled over HTTP too if you prefer HTTP over SMB for the image.
    location ~* \.(wim|esd|iso|efi|wbm)$ {
        types { application/octet-stream wim esd iso efi wbm; }
        default_type application/octet-stream;
        add_header Cache-Control "no-store" always;
        gzip off;
    }

    access_log /var/log/nginx/pxe-access.log;
    error_log  /var/log/nginx/pxe-error.log;
}
